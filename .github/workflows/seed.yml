name: Seed Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to pull DATABASE_URI from
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      confirm:
        description: This clears existing collections/globals before reseeding. Type "SEED" to confirm.
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    # Pinned to the "production" GitHub Environment because that's where the
    # VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets are configured —
    # unrelated to which Vercel environment (production/preview) is seeded,
    # which is controlled below via inputs.environment.
    environment: production
    steps:
      - name: Verify confirmation input
        if: inputs.confirm != 'SEED'
        run: |
          echo "::error::Confirmation text did not match \"SEED\" — aborting to avoid an accidental reseed."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull env vars
        run: vercel env pull .env.production.local --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Loaded via dotenv-cli (not shell `source`) because Postgres passwords
      # routinely contain `$`/backtick characters that `source` would
      # reinterpret as shell expansions and corrupt.
      - name: Run seed script
        run: pnpm dlx dotenv-cli -e .env.production.local -- pnpm seed
