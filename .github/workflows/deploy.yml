name: Migrate and Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Payload's `migrate` command needs DATABASE_URI etc. in the shell env.
      # `vercel pull` only makes vars available to `vercel build`/`vercel deploy`,
      # so pull them again into a plain dotenv file we can source ourselves.
      - name: Pull production env vars
        run: vercel env pull .env.production.local --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Migrations run DDL, which is unsafe over a pgbouncer pooled connection.
      # Supabase provides POSTGRES_URL_NON_POOLING for exactly this case; the
      # deployed app still uses the pooled DATABASE_URI at runtime.
      - name: Run Payload database migrations
        run: |
          set -a
          . ./.env.production.local
          set +a
          export DATABASE_URI="${POSTGRES_URL_NON_POOLING:-$DATABASE_URI}"
          pnpm payload migrate

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
