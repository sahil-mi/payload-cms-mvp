name: Migrate and Deploy to Vercel

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Payload's `migrate` command needs DATABASE_URI etc. in the shell env.
      # `vercel pull` only makes vars available to `vercel build`/`vercel deploy`,
      # so pull them again into a plain dotenv file we can source ourselves.
      - name: Pull production env vars
        run: vercel env pull .env.production.local --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Loaded via dotenv-cli (not shell `source`) because Postgres passwords
      # routinely contain `$`/backtick characters that `source` would
      # reinterpret as shell expansions and corrupt.
      - name: Run Payload database migrations
        run: pnpm dlx dotenv-cli -e .env.production.local -- pnpm payload migrate

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
